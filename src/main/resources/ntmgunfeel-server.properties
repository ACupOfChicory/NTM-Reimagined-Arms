# NTM Reimagined Arms, server side, shipped in the mod
bulletSpeed = 1.6
# Shared model-part hitboxes for living entities (melee picking, projectiles, NTM bullets and beams).
# Missing/expired poses and unsupported renderers keep the original hitbox. Not a per-gun switch.
modelHitboxes = true
# What a mob or player wears grows its model hitbox and head (with modelHitboxes): the parts under armor by the
# armor's thickness as drawn (helmet, chestplate, boots 1 pixel a side, leggings 0.5), the head under a skull or a
# block (a carved pumpkin) to the size it is drawn at, solid. Off: only the armor's own drawn surface counts and the
# parts under it stay bare.
modelHitboxesWorn = true
# A shot on a helmet is a shot in the head, whatever the helmet: a layer's helmet over the head (vanilla's, NTM's
# Security and the like) and an NTM suit's own helmet model (T-51, HEV, AJR, NCR and the rest), which stands further off
# the head than the head's zone grows; F3+B shows the helmet as the head. False: as X949 (an NTM suit's helmet edge was
# the body; a bot's helmet hit as the head but showed as the body).
modelHitboxesHelmet = true
# A shot on an NTM suit's own model (T-51, HEV, AJR, NCR, BJ, FAU, Trenchmaster and the rest) is a shot in the part its
# piece covers: the chest's (collar, breastplate) the body, the arms' (shoulder pads, sleeves), legs' and boots' the
# limb. False: as X953 (the collar and shoulder pads were the head, the arms and legs the body).
modelHitboxesSuits = true
# A player's bullet hits the mobs and players their own game saw it hit: that part, at that point. The server checks
# only for mistakes (the target is alive and near, the bullet is that player's and still flies, one hit per target),
# not for cheats. A bullet near mobs waits up to the player's ping and 3 ticks for the report; one that comes later,
# and every bullet that is not a player's (the AI bots'), goes by the server's view of the models. Off: the server's
# view for all bullets.
clientHits = true
# The living spread. NTM's own spread: a shot leans off by spread x a normal random per axis, 0.025 is about 1.4
# degrees. Most guns have only the hip-fire part (0.025), which NTM already drops when aiming; automatics add a little
# innate spread (0.005 to 0.015), shotguns their ammo's. A gun can have its own of any: hbm\:gun_xxx.spreadAim = 0.5
# Multipliers on NTM's spread (1 = unchanged). spreadMove is at walking speed and follows the speed (x1.25 at half of
# it, x1.65 sprinting). spreadStack = 1: states multiply together (sneak + aim is tighter than aim alone); 0: only the
# strongest body state (crawl > sneak > move > stand) times aim. spreadCrawl is lying down (the prone key, or crawling
# under a trapdoor), half as TaCZ's lie against its stand; crawling along adds no walking spread then, as in TaCZ.
spreadStand = 1
spreadMove = 1.5
spreadSneak = 0.75
spreadCrawl = 0.5
spreadAim = 1
spreadStack = 1
# Added on top, so it reaches the guns with no spread when aiming too. spreadSpeed per walking speed: 0.008, about half
# a degree walking, 0.6 sprinting. spreadAir while jumping or falling: about 1.7 degrees.
spreadSpeed = 0.008
spreadAir = 0.03
# Bloom: every shot adds spreadBloom for the next, at most spreadBloomMax, halving every spreadBloomHalfLife seconds;
# sneaking and crawling hold it down by their multipliers. A burst held down settles at about 0.4 degrees firing every
# 3 ticks, 0.7 every 2, 1.5 every tick; single shots half a second apart get almost nothing.
spreadBloom = 0.004
spreadBloomMax = 0.03
spreadBloomHalfLife = 0.25
# Camera recoil the players can't go below: their cameraScale is raised to this, and their own up and sideways curves
# and a shorter cameraTime are not used. 0 = the players decide. The shake, the gun model and the arms stay theirs.
cameraScaleMin = 0
# Bullets wear concrete down and break it (vanilla concrete after about 1000 damage, NTM's after about 8000; only the
# damage above 20 per bullet counts, so rifles chip it and machine guns don't). Off: concrete never breaks.
bulletBreakConcrete = false
# NTM's old bullet of the hunter chopper and the cyber crab, which no player's gun fires: counted where it meets the
# model (head x1.75, limbs x0.5, as NTM's bullets), breaks blocks by the bullet rules (ntmgunfeel-bullets.txt: glass,
# "pass" flies on) and leaves a hole where it stops. Turrets and NPCs firing NTM's bullets (Sentry, Chekhov, Jeremy,
# Maskman, skeletons with guns) go through the mod's systems anyway. Off: the old bullet is NTM's as it is.
npcShots = true
# NTM's blasts (grenades, rockets, 40 mm and GL-54 shells, mines, charges, missiles, artillery, C4, dynamite) hurt each
# part of the body on its own: its distance to the blast, its share of the blast's rays (a wall in between shields what
# it covers), its share of the damage by its size (the shares sum to 1) and its multiplier (head x1.75, limbs x0.5)
# after the armour. blastPartRays: rays from each part, 1 to 9. For the mobs whose model marks a head or limbs, with
# modelHitboxes on; the others, nuclear blasts and fire, plasma or electric blasts are NTM's. Off: NTM's.
blastParts = true
# blastPartsEven: each part's multiplier divided by the mob's mean one (the parts' shares times their multipliers): a
# mob in the open takes about NTM's damage, the head still more than the limbs, a mob behind a wall less. Off: a mob
# with a marked head and no marked limbs takes no more than NTM's, a standing FBI agent takes about 20% less than NTM's
# in the open.
blastPartsEven = true
blastPartRays = 3
# The damage cap: what one shooter can take off a player. One click (all the projectiles one shooter fired in one tick:
# a shotgun's pellets, SPAS-12's double shot, both barrels, Liberator's four rounds, both akimbo guns) takes at most
# damageCapClick of the target's max health, damageCapHead on the head; any damageCapWindowTicks ticks in a row at most
# damageCapWindow. A gun that waits damageCapSniperDelay ticks or more between shots (AMAT, MAS-36, Penance,
# Subtlety) takes up to damageCapSniperHead with a head click, so it still kills with one; a pellet of a round of
# several (buckshot, Pepperbox's stone shot) never does. Health, absorption and NTM's
# shield count together; the shield's share over the cap is given back. What a shooter (a player, a bot, any mob) fires
# is capped, and NTM's blasts; nuclear blasts, digamma, fire, falling, radiation, gas, melee and vanilla blasts are not,
# nor an NTM blast of more raw damage (after NTM's shield) than 60 (a mine, C4, TNT: building, not a
# weapon). damageCapBlasts off: no NTM blast is capped. Each shooter has their own cap on each target. damageCapMobs: mobs and AI bots as targets
# are capped too. Off: NTM's damage as it is.
damageCap = true
damageCapClick = 0.6
damageCapHead = 0.8
damageCapWindow = 0.8
damageCapWindowTicks = 14
damageCapSniperDelay = 25
damageCapSniperHead = 1.0
damageCapMobs = false
damageCapBlasts = true
# Any NTM blast's hit counts in the click it went off in, whatever its damage class (the Tesla Cannon's electric blast
# with its beam). false: as X865 (only explosive-class blasts; a Tesla click took the blast past the cap).
damageCapAnyBlast = true
# The balance: arms (the mod's, the default) or ntm (NTM's own). arms: NTM's combat sets take bullets, beams and blasts
# by the mod's armour formula, and a gun with its ammo kills a set in the time of the mod's ladder by their tiers, the
# gun's role and the range; launchers' rounds and hand grenades on the same ladder; the kit (the shield, Med-X, the super
# stimpak, the inserts), the pools of euphemium, DNS and FAU, the sets' abilities, a steadier aim and less recoil in
# power armour, the shotguns' aimed choke and the balance's recipes. ntm: none of it: NTM's damage, armour, spread,
# range, blasts, abilities and recipes as they are; the mod's rules that are not the balance (damageCap, the living
# spread, bulletSpeed, modelHitboxes and the rest) keep their own keys. Every number of the balance is fixed in the mod; the old balance*,
# abilities.*, powerArmorSpread*, powerArmorRecoil* and spread*Knee/Over keys of this file are not read any more.
balance = arms
# The guns' recipes with the gun mechanisms NTM has no item for (the mod adds them: steel, high-speed steel, desh,
# ferrouranium and technetium steel, cast in the crucible's mechanism mold like NTM's three). A mechanism stands for a
# gun's tier, as in NTM, on eight steps: steel < gunmetal < high-speed steel < desh < ferrouranium < weapon steel <
# technetium steel < saturnite. Steel: the flare gun, Grease Gun, light revolver, Maresleg and Charge Thrower;
# high-speed steel: AM180, Congo Lake, the flamethrower and Liberator; desh: the carbine, heavy revolver,
# Panzerschreck, SPAS-12, UZI, and the B-sides Atlas, Henry Lincoln, the Maresleg pair and Topaz; ferrouranium: AMAT,
# the auto-shotgun, M2, Quadro and the UZI pair; technetium steel: Lag, the minigun, the missile launcher, the GL-54
# and Tesla Cannon (saturnite with balance = arms). One recipe of each in the recipe book and JEI. Read when the data packs load:
# a change counts after /reload or a restart. Off: NTM's recipes (the mechanisms stay, cast and melted as before).
gunMechanismRecipes = true
# NTM's beams (laser guns, Tesla Cannon, Lacunae, Tau, N.I.4.N.I., Aberrator, shredder shells, laser grenade) go
# through blocks as a bullet of the same damage: through fence gaps and empty cells, piercing glass and thin wood with
# the same loss, wearing and breaking what bullets wear and break. They leave no holes; a creature behind a pierced
# block gets what is left, blocks behind the creature a beam hits are not touched (water: beamWater, glass for lasers:
# laserGlass); Folly's beam and Tau's charged shot go through blocks, as in NTM. The same for the Tauon and
# Maxwell turrets and the Tesla arcs (the coil, the crabs, the Tesla armor): they see and hit a target where their
# beam gets through, with what is left of its damage (a turret's shot with the zone it meets on the model). Off: NTM's
# beams, stopped by the first block with a box.
beamRules = true
# With beamRules, beams in water (guns', turrets', Tesla arcs): the damage falls with the path through water,
# x exp(-s/beamWaterLength) (s in blocks; a falling stream counts 0.15 of its path), and where less than beamWaterFade
# of it is left the beam is gone, hitting nothing past there. With 2 and 0.1: 1 block of water leaves 0.61 of the
# damage, 3 blocks 0.22, a beam is gone after 4.6 blocks. A turret or a Tesla coil does not see a target its beam
# would not reach. Off: beams go through water as in NTM.
beamWater = true
beamWaterLength = 2.0
beamWaterFade = 0.1
# Lasers go through glass of any kind (vanilla glass and panes, NTM's glass, wired glass, laminate, machine windows)
# without breaking, wearing or holing it and without losing damage: with beamRules the laser beams (Laser Pistol,
# Pew Pew, Laser Rifle, Morning Glory, Lacunae, the laser grenade, the Shredder's plasma beam, the Maxwell turret),
# and the mobs' flying laser shots (the masked man's bolt, tracer and orb, BOT Prime's and the UFO's bolt and laser).
# The Shredder's slow drops, other beams (Tesla, Tau, Tauon, N.I.4.N.I., Aberrator) and bullets meet glass as bullets
# do. Off: lasers meet glass as bullets do.
laserGlass = true
# Bullets pierce machines (NTM's and other mods' machines: a hollow steel casing). Off: a machine stops every bullet.
bulletPierceMachines = false
# The clear pixels on the models of NTM's machines are glass, not air (a chemical plant's windows): a bullet pierces
# them as glass, loses a little and leaves a hole, whatever bulletPierceMachines says. Grates and other really empty
# places stay open (ntmgunfeel-machine-glass.txt in the mod). Off: bullets fly through the windows as through air.
bulletMachineGlass = true

# No shot right after a sprint (as TaCZ's sprint_time). While a player sprints the sprint time grows to the gun's
# sprintFireTime (seconds) and after the sprint it runs back down at the same rate; the gun does not fire while it is
# above zero. A click held back fires once it runs out, if the key is still held. The client stops sprinting while a
# fire key is held or the gun aims. On by default; a gun can have its own: hbm\:gun_xxx.sprintFireDelay = false
sprintFireDelay = true
sprintFireTime = 0.15
# pistols and revolvers 0.08, submachine guns 0.1, heavy guns and launchers 0.19, the rest 0.15
hbm\:gun_light_revolver.sprintFireTime = 0.08
hbm\:gun_light_revolver_atlas.sprintFireTime = 0.08
hbm\:gun_light_revolver_dani.sprintFireTime = 0.08
hbm\:gun_heavy_revolver.sprintFireTime = 0.08
hbm\:gun_heavy_revolver_lilmac.sprintFireTime = 0.08
hbm\:gun_heavy_revolver_protege.sprintFireTime = 0.08
hbm\:gun_pepperbox.sprintFireTime = 0.08
hbm\:gun_star_f.sprintFireTime = 0.08
hbm\:gun_lag.sprintFireTime = 0.08
hbm\:gun_flaregun.sprintFireTime = 0.08
hbm\:gun_laser_pistol.sprintFireTime = 0.08
hbm\:gun_laser_pistol_pew_pew.sprintFireTime = 0.08
hbm\:gun_laser_pistol_morning_glory.sprintFireTime = 0.08
hbm\:gun_aberrator.sprintFireTime = 0.08
hbm\:gun_n_i_4_n_i.sprintFireTime = 0.08
hbm\:gun_debug.sprintFireTime = 0.08
hbm\:gun_greasegun.sprintFireTime = 0.1
hbm\:gun_uzi.sprintFireTime = 0.1
hbm\:gun_uzi_akimbo.sprintFireTime = 0.1
hbm\:gun_am180.sprintFireTime = 0.1
hbm\:gun_m2.sprintFireTime = 0.19
hbm\:gun_minigun.sprintFireTime = 0.19
hbm\:gun_minigun_lacunae.sprintFireTime = 0.19
hbm\:gun_minigun_dual.sprintFireTime = 0.19
hbm\:gun_amat.sprintFireTime = 0.19
hbm\:gun_amat_subtlety.sprintFireTime = 0.19
hbm\:gun_amat_penance.sprintFireTime = 0.19
hbm\:gun_panzerschreck.sprintFireTime = 0.19
hbm\:gun_stinger.sprintFireTime = 0.19
hbm\:gun_quadro.sprintFireTime = 0.19
hbm\:gun_missile_launcher.sprintFireTime = 0.19
hbm\:gun_tau.sprintFireTime = 0.19
hbm\:gun_coilgun.sprintFireTime = 0.19
hbm\:gun_fatman.sprintFireTime = 0.19
hbm\:gun_flamer.sprintFireTime = 0.19
hbm\:gun_flamer_topaz.sprintFireTime = 0.19
hbm\:gun_flamer_daybreaker.sprintFireTime = 0.19
hbm\:gun_chemthrower.sprintFireTime = 0.19
hbm\:gun_tesla_cannon.sprintFireTime = 0.19
hbm\:gun_folly.sprintFireTime = 0.19
hbm\:gun_drill.sprintFireTime = 0.19
hbm\:gun_mk108.sprintFireTime = 0.19
hbm\:gun_charge_thrower.sprintFireTime = 0.19
hbm\:gun_bolter.sprintFireTime = 0.19

# Lying down on the prone key (X, as TaCZ's crawl): vanilla's crawling pose (the one under a trapdoor: a 0.6 high box,
# a third of the walking speed), with an NTM gun or, by proneWithoutGun, without one. Only on the ground, not jumping,
# swimming, riding or gliding; the player gets up when that no longer holds. Lying, the view turns up at most
# proneMaxUp degrees and down at most proneMaxDown (90 and 90 = as standing). Off: the key does nothing.
prone = true
proneWithoutGun = true
proneMaxUp = 45
proneMaxDown = 30
# No shot while crawling: a shooter lying (the prone key, crawling under a trapdoor, a mob laid down) that moves along
# the ground faster than proneCrawlSpeed blocks a second does not fire. Lying still, or only turning, it fires as before.
# A click does nothing then (no dry fire, no round spent, nothing kept for later) and a held burst stops: a new click
# fires again once the shooter lies still. Aiming and reloading are not touched. Crawling is about 1.3 blocks a second;
# a player who lets the key go can fire again about four ticks later. proneCrawlSpeed = 0: any step along the ground
# counts. A gun can have its own: hbm\:gun_xxx.proneCrawlNoFire = false
proneCrawlNoFire = true
proneCrawlSpeed = 0.25
# Tools, not guns: the drill and the charge thrower (its hook) work while crawling.
hbm\:gun_drill.proneCrawlNoFire = false
hbm\:gun_charge_thrower.proneCrawlNoFire = false

# A player in spectator mode does not use an NTM gun: no shot, no aim, no reload, no ammo choice, and no gun HUD (NTM's
# counter and crosshair, the mod's corner HUD); the gun is put away, so a reload, burst or power armor swing begun
# before the mode changed stops. NTM itself lets a spectator fire and hurt mobs. Off: as in NTM.
spectatorNoGuns = true

# Bullets in water. A bullet slows by the path it goes through water, f <- f*exp(-rho*s / L) with L by the kind of
# bullet (pistol 1.25 blocks, rifle 0.65, .50 0.7, armour piercing 0.9, slug 1.4, buckshot 0.3, dart 2.0), and stops
# under waterStopFraction of its speed; damage and piercing go x f^2, a hole behind water x (0.5 + 0.5*f). A shallow
# hit on still water skips (under waterSkipAngle degrees, at most twice). Off: water does nothing to bullets, as in NTM.
waterBallistics = true
waterStopFraction = 0.15
# times every stopping length L
waterRangeScale = 1.0
waterSkipAngle = 6
# a gun fired under water sounds muffled: volume x 0.6, pitch x 0.7
waterMuffle = true
# Explosives: an impact fuze goes off on water (a shallow hit under waterFuzeSkipAngle degrees skips instead); a blast
# in water hurts mobs in the same water out to waterBlastRadius x its radius.
waterFuze = true
waterFuzeSkipAngle = 10
waterBlastRadius = 1.5

# A smoke cloud fills the open cells around it, does not pass walls, stays dense for about 22 s and is gone about 7 s
# after it starts to thin. For now only the operator command /gunsmoke lets one out; a smoke grenade will come later.
# Off: no cloud comes out. How it is drawn is each player's own setting (smokeQuality).
smoke = true

# Mobs do not see through thick smoke: a mob loses a target behind a cloud as behind a wall (one within reach still
# finds it). Off by default.
smokeBlocksMobSight = false

# The mod's own GL-54 grenade launcher (the first item the mod adds). Off: the gun stays in the game, it can be given and
# held and a world keeps it, but it does nothing: no shot, no reload; a grenade already in flight falls as a dud.
gl54 = true
# The GL-54's laser range finder does not measure through thick smoke: the laser ends in the cloud, the range stays as
# it was. false: it sees through.
gl54.rangeSmoke = true

# GL-54 gas grenades. Chlorine makes the player cough (the camera shakes); while a cough lasts, aiming is shut.
# Off: the cough only shakes the view.
gasCoughBlocksAim = true

# GL-54 gas grenades. A bullet that flies through a gas cloud thins the gas along its path, and a blast blows the gas
# around it away. Off: the gas is left as it is. Smoke is never stirred (see smokeHole).
gasStir = true

# A blast punches a hole in a smoke cloud that closes again from its edge in 2 to 3 seconds; bullets leave smoke as it is.
# Off: smoke is left as it is.
smokeHole = true

# Heavy and super-heavy guns (the tesla cannon, the minigun, the rocket launchers, the drill, the Fat Man...) in either
# hand slow the player a little, walking and running; the heavier hand counts, two miniguns weigh as one. Not in creative
# or spectator; the AI's soldiers are not slowed. The classes: ntmgunfeel-gun-weight.txt in the mod jar. Off: no one is.
gunWeightSlow = true
# Share of the speed a heavy and a super-heavy gun leave, 0.5 to 1 (0.94: 6% slower; 0.88: 12%).
gunWeightHeavySpeed = 0.94
gunWeightSuperHeavySpeed = 0.88

# GL-54 gas poisons the ground it lies on. Where it lies for long (at one place in a row: a magazine of mustard, two of
# chlorine or acid, three of phosgene), the ground turns into a poisoned biome for good: nothing grows there and the
# grass and leaves turn a sick yellow-brown. Off: the ground stays as it is.
gasPoison = true

# The mob AI works out where its mobs can stand and hide (its tactical map) on aiThreads background threads, so the
# server's own thread is not held up. The players' game may run on the same machine: 2 by default, 1 to 8.
aiThreads = 2

# AI mobs think only within aiRadius blocks of a player (across, at any height): further off they stand still where
# they are, and go on when a player comes near. 128 by default, 32 to 256. Mobs past the server's simulation-distance
# do not move at all whatever this says: for 256 it must be 16 or more.
aiRadius = 128

# How well AI mobs shoot: recruit, regular or veteran. They act on where they saw a target a moment ago (4, 3, 2
# ticks), correct their aim every 6, 4, 2 ticks, each correction off by 30, 20, 12 % of its size at random and at
# least 0.30, 0.15, 0.08 degrees, turn at most 20, 30, 30 degrees a tick, fire while the spot they expect the target at
# is within 1.5, 1, 0.8 of half a body's width of the barrel, notice a target 2 ticks later or sooner than a regular,
# and (regular, veteran) read a steady strafe. regular by default.
aiSkill = regular

# A shot kicks an AI mob's view as it kicks a player's camera: NTM's recoil for the gun times the camera's 0.55 (or the
# gun's own, no lower than cameraScaleMin), with the gun's climb and drift that stay (cameraClimb, cameraClimbDeg,
# cameraDriftDeg, grown over cameraClimbRamp shots of a burst), less while it aims (the gun's adsRecoil) or lies (half),
# all times aiRecoil. What does not stay comes back by itself as NTM's does; what is left the mob pulls back once it
# notices, a regular a moment after the shot (a veteran takes back 60 % of the kick at once, a regular 30 %, a recruit
# none). 1 by default, 0 for no recoil.
aiRecoil = 1

# AI mobs decide as the model trained on a player's recorded fights does (/armsai record, tools/imitation): when to
# look out of cover, get back in, move to other cover and which, go after someone lost. The model is read from
# config/ntm-gunfeel-imitation.json; where it has seen nothing like the fight at hand, and with no model, they decide
# as before. false by default.
aiImitation = false

# How many of NTM's frag grenades an AI mob carries when the AI takes it over (kept on the mob after that). It throws
# one at a target gone behind cover 15 to 26 blocks off, to burst near where it went, never near itself or its own;
# every AI mob runs from a grenade it sees coming. 2 by default, 0 to 8; 0: none throws.
aiGrenades = 2

# How many smoke grenades an AI mob carries when the AI takes it over (kept on the mob after that). Shaken and falling
# back, it first throws one half the way to the threat (one of its squad at a time): the GL-54 smoke grenade's cloud,
# which AI mobs do not see through. Needs smoke on (smoke). 1 by default, 0 to 4; 0: none throws smoke.
aiSmokes = 1

# Whether AI mobs call out (contact, a grenade thrown or seen, a reload, falling back, a friend down), each in a voice
# of its own, not too often. Players hear them as the game's voice sounds (their Voice/Speech slider) and may turn them
# off or down on their own client (aiVoice, aiVoiceVolume). No AI mob hears them. true by default.
aiVoices = true

# AI mobs are suppressed as players are: each has the same scale of 0 to 100, raised by the same things with the same
# forces and ranges (suppressionPass…, suppressionRecovery below; it needs no suppression = true): a foe's bullet
# passing its eyes, one stopping near it (in its cover too), a blast near. From 50 up it is pinned down: it does not
# rise into the fire, behind low cover it fires blind over it, in the open it lies down; and while the scale is up its
# confidence falls, so a squad kept under fire holds back and, in the end, falls back. Its own side's shots do not
# count. false: as before, three shots within 2 blocks of it in a second pin it down for three. true by default.
aiSuppression = true

# Roles in a squad of AI mobs, by the gun in a mob's hands. One with a machine gun among riflemen is the squad's base
# of fire: it does not go round the side nor after a lost target; while one of the others is on the move it keeps the
# place the target hid at under fire in long bursts with short gaps (a player there stays suppressed), and reloads
# when no one moves. A machine gun here: fires on while the trigger is held, a shot every 4 ticks or faster, real
# bullets, fed by a belt or a magazine of aiBaseMagazine rounds or more (machine guns, miniguns, automatics with a big
# magazine). A squad of machine guns only, or of none, fights as before. aiRoles = false: no roles.
aiRoles = true
aiBaseMagazine = 40

# Doors on an AI soldier's way: a shut door or gate that a hand opens (wooden doors, fence gates, NTM's metal, office,
# bunker and red doors) no longer stops it: its path goes through, and it opens the door as it comes up to it and
# leaves it open. Iron doors, trapdoors and NTM's sliding, blast and vault doors stay shut to it. aiDoors = false: a shut door is a wall to it, as before.
aiDoors = true

# Going into a room: AI soldiers that go after a target lost in a building (cells under a roof, cut into rooms at
# doorways) come up beside the way into its room, behind the wall and out of the line through it, wait up to 5
# seconds for a second one, and go in together, each to its own side of the way in; then they search as before. A
# way in one or two blocks wide counts. aiEntry = false: they walk in one after another, as before.
aiEntry = true

# Searching a building: AI soldiers that go after a target lost in a building search it room after room. The ones
# of a side that go after it share one list of its rooms: a room is checked when every place in it has been looked
# at by one of them, and no one goes back into it; the two that go after it take a room together, then the next
# one. With every room checked they search outside as before. aiClearing = false: they search round the place the
# target was lost, each on its own, as before.
aiClearing = true

# A cave or a building: the AI reads a place under a roof as a building by its shell: the block under each cell, the
# roof over it and its walls. Where the shell is mostly ground as the world made it, the place is no building (a cave,
# a hollow under a tree): the squad does not stack up at its openings. Blocks someone put there make it one (a bunker,
# a house; where a bunker is broken into a cave, the building ends at the breach). Ground counts as a building all the
# same within 8 steps of a sign that someone lives there, and no farther than a door: a cellar dug out of the rock with
# a chest in it, not the cave past its door. aiRoomsShell = false: any roof makes a building, as before.
aiRoomsShell = true
# Which blocks are which, each a list separated by spaces: block ids, #tags, ~patterns (a regular expression on the
# whole id), as in the bullet rules. aiRoomsNatural: the ground as the world makes it. A sign that someone lives there
# is any block that keeps something (a chest, a furnace, a machine) and the blocks of aiRoomsDwelling, but for the
# blocks of aiRoomsWild (a spawner keeps something and nobody lives by it). Every other block a mob bumps into is one
# put there. Sections already read keep what they were read with until they change.
aiRoomsNatural = #minecraft:base_stone_overworld #minecraft:base_stone_nether #minecraft:dirt #minecraft:sand #minecraft:leaves #minecraft:logs #minecraft:snow #minecraft:ice #minecraft:terracotta #minecraft:nylium #minecraft:coral_blocks #c:ores #c:gravels #c:sandstone/blocks #c:end_stones #c:netherracks #c:obsidians minecraft:clay minecraft:calcite minecraft:dripstone_block minecraft:pointed_dripstone minecraft:moss_block minecraft:magma_block minecraft:soul_sand minecraft:soul_soil minecraft:basalt minecraft:blackstone minecraft:smooth_basalt minecraft:amethyst_block minecraft:budding_amethyst ~minecraft:(.*_)?sculk(_.*)? ~hbm:(stone_resource|stone_biome|ore|cluster|glyphid_base|basalt|sellafield|waste_).*
aiRoomsDwelling = #minecraft:beds #c:workbenches
aiRoomsWild = minecraft:spawner minecraft:trial_spawner minecraft:vault #minecraft:beehives ~minecraft:(.*_)?sculk(_.*)? minecraft:suspicious_sand minecraft:suspicious_gravel ~hbm:glyphid.*

# Suppression under fire: a scale of 0 to 100 on each player's client. Someone else's bullet passing within
# suppressionPassRange blocks of the eyes adds about 25 to 32, one stopping (in a block, a creature, water) within
# suppressionImpactRange up to 60 by how close, a blast within suppressionBlastRange (more for a big one, up to three
# times) up to about 58; passes and hits close in time count up to 3.3 times more in a burst. The player's own
# bullets and blasts, lasers and beams do not count, nor a grenade before it goes off. The scale climbs in a few ticks
# and falls from full to none in suppressionRecovery seconds. Under it the screen darkens, more at the edges (at most
# 40 % at the edges and 22 % in the middle, times suppressionDarken), and the other sounds go down (the world's to
# 40 %, shots, blasts and bullets to 79 %, times suppressionMuffle); each player may take less on their own client.
# suppressionPass, suppressionImpact, suppressionBlast: each source's force times this (0: it does not count).
# suppressionFlinch: each event also turns the view a little to a random side (0.11 to 0.66 degrees at
# suppressionFlinchDeg = 0.22), and it stays there; not while riding. Off by default: it costs aim in PvP.
# suppression = false: none of it.
suppression = true
suppressionPass = 1
suppressionImpact = 1
suppressionBlast = 1
suppressionPassRange = 3.5
suppressionImpactRange = 8
suppressionBlastRange = 14
suppressionRecovery = 5
suppressionDarken = 1
suppressionMuffle = 1
suppressionFlinch = false
suppressionFlinchDeg = 0.22

# A player hit by an NTM gun (a bullet, a pellet, a beam; not a blast, a melee hit, a mob, an arrow or a fall) is not
# thrown back and does not stop short: the game's knockback and its resend of the player's motion are left out
# (gunHitKnockback = true gives them back). Nor does their view tilt with the hit (gunHitTilt = true gives it back).
# The damage, the hurt sound and the red of the hit stay. Both false by default: a hit does not cost the aim.
gunHitKnockback = false
gunHitTilt = false

# The 12 gauge electroshock shell (NTM's 12 gauge shotguns but the Shredder): one round of little damage; a hit on a
# player, an AI bot or any mob shocks it at full for shockSeconds, then the shock wears off smoothly over 3 seconds
# more. Meanwhile it walks up to 40 % slower (a player's view narrows with it, as with Slowness), its shots spread wide
# (shockSpread in NTM's units, added to each shot's own: buckshot's is 0.035, 0.12 is about 7 degrees each way; a
# beam's the same in degrees), and a player's HUD (other mods' HUDs too, not the chat nor the menus) glitches and shakes
# (at most shockGlitch, 0 to 1; each player may take less, but no less than shockGlitchMin of it), the view shakes a
# little (shockShake degrees) and turns about on its own (shockCamera degrees a second at most, the aim with it). After
# a shock ends the one shocked takes none for shockImmunity seconds, so a stream of shells does not keep anyone
# shocked. shock = false: the shell still hits, but shocks no one.
shock = true
shockSeconds = 2
shockImmunity = 3
shockSpread = 0.12
shockGlitch = 1
shockGlitchMin = 0.5
shockCamera = 45
shockShake = 0.6
