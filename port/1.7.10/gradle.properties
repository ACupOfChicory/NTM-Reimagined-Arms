# NTM Reimagined Arms on Minecraft 1.7.10 Forge (GTNH build template, GTNHGradle 2.0.33).
# The version is counted from git in build.gradle.kts (see the root CLAUDE.md, port/* branches), not set here.
gtnh.settings.blowdryerTag = 0.2.2
modName = NTM Reimagined Arms
modId = ntmgunfeel
modGroup = acup.gunfeel
useModGroupForPublishing = true
autoUpdateBuildScript = false
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/
developmentEnvironmentUserName = Developer

# Java mode. jvmDowngrader: the sources are Java 25 (the 26.2 files compile as they are) and the jar is Java 8 bytecode
# with the Java 9+ library calls it needs shaded in (shade: the players' GTNHLib 0.11.30 has no stubs).
# No multi-release jar (build.gradle.kts): FML 1.7.10 reads every class in the jar with ASM 5 and drops the whole jar
# on a Java 21 class under META-INF/versions. Other modes: jabel (Java 8 API only, records need @Desugar: the shared
# 26.2 files would not compile), modern (Java 25 bytecode: needs lwjgl3ify, cuts players on Java 8).
enableModernJavaSyntax = jvmDowngrader
jvmDowngraderStubsProvider = shade
enableGenericInjection = true

gtnh.modules.gitVersion = false
generateGradleTokenClass = acup.gunfeel.Tags
gradleTokenVersion = VERSION
replaceGradleTokenInFile =
apiPackage =
accessTransformersFile =

usesMixins = true
separateMixinSourceSet =
usesMixinDebug = false
mixinPlugin =
mixinsPackage = mixins
coreModClass =
containsMixinsAndOrCoreModOnly = false
forceEnableMixins = false

# JOML (MIT) for Arms/GunGeometry as in 26.2, relocated into acup.gunfeel.shadow (third-party/joml.txt)
usesShadowedDependencies = true
minimizeShadowedDependencies = true
relocateShadowedDependencies = true
includeWellKnownRepositories = true
excludeWellKnownRepositories =
usesMavenPublishing = false
modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeEnvironments = client,server
curseForgeRelations =
customArchiveBaseName = reimagined-arms

org.gradle.configuration-cache = true
org.gradle.parallel = true
disableSpotless = true
disableCheckstyle = true
