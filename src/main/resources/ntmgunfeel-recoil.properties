# NTM Gun Feel recoil presets: <preset>.<channel> = amount,attack,settle,bounce,delay,freq (see Spring.java)
# amount = peak (sign = direction), attack = s to peak, settle = s from peak to ~2%, bounce = overshoot share 0..0.9,
# delay = s before start, freq = shake Hz (overrides bounce). Values are for recoil strength 1; trailing zeros optional.
# Values come from real-world recoil data and reasoning only, see notes/recoil-presets-sources.md.

# default: neutral mild push for energy weapons, flamethrowers and anything unclassified
default.kickPitch = 5,0.04,0.25,0.08
default.kickYaw = 1.5,0.04,0.22
default.kickRoll = 2.5,0.045,0.25,0.1
default.kickPosY = 0.4,0.04,0.22
default.kickPosZ = 2.5,0.025,0.2,0.08
default.cameraPitch = 1,0.035,0.28,0.04
default.cameraYaw = 1,0.035,0.26
default.cameraRoll = 0.8,0.01,0.14,0,0,12

