# NTM Reimagined Arms, server side, shipped in the mod: seconds before a reload / an inspect ends that the held aim comes back
hbm\:gun_double_barrel.reaimInspect = 0.6
hbm\:gun_double_barrel_sacred_dragon.reaimInspect = 0.6
bulletSpeed = 1.6
# bullet spread by state (times NTM's spread; 1 = unchanged). spreadStack = 1: states multiply together (sneak + aim
# is tighter than aim alone); 0: only the strongest body state (crawl > sneak > move > stand) times aim.
# A gun can have its own: hbm\:gun_xxx.spreadAim = 0.5
# NTM's own spread: a shot leans off by spread x a normal random per axis, 0.025 is about 1.4 degrees. Most guns have
# only the hip-fire part (0.025), which NTM already drops when aiming, so aiming stays 1 here; automatics add a little
# innate spread (0.005 to 0.015), shotguns their ammo's. Walking widens it by half, sneaking and crawling tighten it.
spreadStand = 1
spreadMove = 1.5
spreadSneak = 0.75
spreadCrawl = 0.55
spreadAim = 1
spreadStack = 1
