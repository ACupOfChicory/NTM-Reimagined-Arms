# Who made each file and under which license (REUSE 3.x, https://reuse.software/spec/).
# Everything is ACupOfChicory's under GPL-3.0-or-later unless a later table names it: new files need no entry.
# When several tables match a file, the last one wins. License texts are in LICENSES/.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 ACupOfChicory"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Notices about other people's work: our text, whatever license the text quotes.
[[annotations]]
path = "third-party/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 ACupOfChicory"
SPDX-License-Identifier = "GPL-3.0-or-later"

