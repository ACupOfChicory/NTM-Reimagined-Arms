# Per Minecraft version: what the mod is built against. The mod's own version is counted from git (CLAUDE.md).
mod.id = "ntmgunfeel"
# the loader this branch builds for: a port names its own (forge, fabric); in the version of port/* branches
mod.loader = "neoforge"

["26.2"]
deps.neoforge = "26.2.0.90"
# NTM is not on a maven: its jar goes in libs/mods/ by hand
deps.ntm = "libs/mods/hbm-neoforge-1.0.3.jar"
