# NTM Reimagined Arms, server side, shipped in the mod
bulletSpeed = 1.6
# Shared model-part hitboxes for living entities (melee picking, projectiles, NTM bullets and beams).
# Missing/expired poses and unsupported renderers keep the original hitbox. Not a per-gun switch.
modelHitboxes = true
# What a mob or player wears grows its model hitbox and head (with modelHitboxes): the parts under armor by the
# armor's thickness as drawn (helmet, chestplate, boots 1 pixel a side, leggings 0.5), the head under a skull or a
# block (a carved pumpkin) to the size it is drawn at, solid. Off: only the armor's own drawn surface counts and the
# parts under it stay bare.
modelHitboxesWorn = true
# A player's bullet hits the mobs and players their own game saw it hit: that part, at that point. The server checks
# only for mistakes (the target is alive and near, the bullet is that player's and still flies, one hit per target),
# not for cheats. A bullet near mobs waits up to the player's ping and 3 ticks for the report; one that comes later,
# and every bullet that is not a player's (the AI bots'), goes by the server's view of the models. Off: the server's
# view for all bullets.
clientHits = true
# The living spread. NTM's own spread: a shot leans off by spread x a normal random per axis, 0.025 is about 1.4
# degrees. Most guns have only the hip-fire part (0.025), which NTM already drops when aiming; automatics add a little
# innate spread (0.005 to 0.015), shotguns their ammo's. A gun can have its own of any: hbm\:gun_xxx.spreadAim = 0.5
# Multipliers on NTM's spread (1 = unchanged). spreadMove is at walking speed and follows the speed (x1.25 at half of
# it, x1.65 sprinting). spreadStack = 1: states multiply together (sneak + aim is tighter than aim alone); 0: only the
# strongest body state (crawl > sneak > move > stand) times aim. spreadCrawl is lying down (the prone key, or crawling
# under a trapdoor), half as TaCZ's lie against its stand; crawling along adds no walking spread then, as in TaCZ.
spreadStand = 1
spreadMove = 1.5
spreadSneak = 0.75
spreadCrawl = 0.5
spreadAim = 1
spreadStack = 1
# Added on top, so it reaches the guns with no spread when aiming too. spreadSpeed per walking speed: 0.008, about half
# a degree walking, 0.6 sprinting. spreadAir while jumping or falling: about 1.7 degrees.
spreadSpeed = 0.008
spreadAir = 0.03
# Bloom: every shot adds spreadBloom for the next, at most spreadBloomMax, halving every spreadBloomHalfLife seconds;
# sneaking and crawling hold it down by their multipliers. A burst held down settles at about 0.4 degrees firing every
# 3 ticks, 0.7 every 2, 1.5 every tick; single shots half a second apart get almost nothing.
spreadBloom = 0.004
spreadBloomMax = 0.03
spreadBloomHalfLife = 0.25
# NTM's power armour and Trenchmaster hold the gun steadier, the later the set the more: what moving, jumping and the
# bloom add counts powerArmorSpread.<set> times, by the chestplate's set (charged or not; 1 turns a set off). Security,
# the steam and diesel suits: no bonus. NTM's own spread, standing, sneaking, crawling and aiming stay as they are.
# powerArmorSpread: only a power armour chestplate with no line of its own (another mod's, a set NTM adds later).
powerArmorSpread = 0.5
powerArmorSpread.t51 = 0.8
powerArmorSpread.hev = 0.7
powerArmorSpread.ajr = 0.7
powerArmorSpread.ajro = 0.7
powerArmorSpread.envsuit = 0.7
powerArmorSpread.trenchmaster = 0.7
powerArmorSpread.bj = 0.6
powerArmorSpread.ncrpa = 0.6
powerArmorSpread.rpa = 0.5
powerArmorSpread.fau = 0.4
powerArmorSpread.dns = 0.4
# The recoil by the same tiers: the camera kick, the gun model kick and NTM's recoil animation count
# powerArmorRecoil.<set> times (the players' clients go by these; on a server with cameraScaleMin the camera's no lower
# than 0.5). powerArmorRecoil: only a power armour chestplate with no line of its own.
powerArmorRecoil = 0.5
powerArmorRecoil.t51 = 0.8
powerArmorRecoil.hev = 0.7
powerArmorRecoil.ajr = 0.7
powerArmorRecoil.ajro = 0.7
powerArmorRecoil.envsuit = 0.7
powerArmorRecoil.trenchmaster = 0.7
powerArmorRecoil.bj = 0.6
powerArmorRecoil.ncrpa = 0.6
powerArmorRecoil.rpa = 0.5
powerArmorRecoil.fau = 0.4
powerArmorRecoil.dns = 0.4
# Camera recoil the players can't go below: their cameraScale is raised to this, and their own up and sideways curves
# and a shorter cameraTime are not used. 0 = the players decide. The shake, the gun model and the arms stay theirs.
cameraScaleMin = 0
# Bullets wear concrete down and break it (vanilla concrete after about 1000 damage, NTM's after about 8000; only the
# damage above 20 per bullet counts, so rifles chip it and machine guns don't). Off: concrete never breaks.
bulletBreakConcrete = false
# NTM's old bullet of the hunter chopper and the cyber crab, which no player's gun fires: counted where it meets the
# model (head x1.75, limbs x0.5, as NTM's bullets), breaks blocks by the bullet rules (ntmgunfeel-bullets.txt: glass,
# "pass" flies on) and leaves a hole where it stops. Turrets and NPCs firing NTM's bullets (Sentry, Chekhov, Jeremy,
# Maskman, skeletons with guns) go through the mod's systems anyway. Off: the old bullet is NTM's as it is.
npcShots = true
# NTM's blasts (grenades, rockets, 40 mm and GL-54 shells, mines, charges, missiles, artillery, C4, dynamite) hurt each
# part of the body on its own: its distance to the blast, its share of the blast's rays (a wall in between shields what
# it covers), its share of the damage by its size (the shares sum to 1) and its multiplier (head x1.75, limbs x0.5)
# after the armour. blastPartRays: rays from each part, 1 to 9. For the mobs whose model marks a head or limbs, with
# modelHitboxes on; the others, nuclear blasts and fire, plasma or electric blasts are NTM's. Off: NTM's.
blastParts = true
# blastPartsEven: each part's multiplier divided by the mob's mean one (the parts' shares times their multipliers): a
# mob in the open takes about NTM's damage, the head still more than the limbs, a mob behind a wall less. Off: a mob
# with a marked head and no marked limbs takes no more than NTM's, a standing FBI agent takes about 20% less than NTM's
# in the open.
blastPartsEven = true
blastPartRays = 3
# The damage cap: what one shooter can take off a player. One click (all the projectiles one shooter fired in one tick:
# a shotgun's pellets, SPAS-12's double shot, both barrels, Liberator's four rounds, both akimbo guns) takes at most
# damageCapClick of the target's max health, damageCapHead on the head; any damageCapWindowTicks ticks in a row at most
# damageCapWindow. A gun that waits damageCapSniperDelay ticks or more between shots (AMAT, MAS-36, Penance,
# Subtlety) takes up to damageCapSniperHead with a head click, so it still kills with one; a pellet of a round of
# several (buckshot, Pepperbox's stone shot) never does. Health, absorption and NTM's
# shield count together; the shield's share over the cap is given back. What a shooter (a player, a bot, any mob) fires
# is capped, and NTM's blasts; nuclear blasts, digamma, fire, falling, radiation, gas, melee and vanilla blasts are not,
# nor an NTM blast of more raw damage (after NTM's shield) than balanceExplRawLimit (a mine, C4, TNT: building, not a
# weapon). damageCapBlasts off: no NTM blast is capped. Each shooter has their own cap on each target. damageCapMobs: mobs and AI bots as targets
# are capped too. Off: NTM's damage as it is.
damageCap = true
damageCapClick = 0.6
damageCapHead = 0.8
damageCapWindow = 0.8
damageCapWindowTicks = 14
damageCapSniperDelay = 25
damageCapSniperHead = 1.0
damageCapMobs = false
damageCapBlasts = true
# Any NTM blast's hit counts in the click it went off in, whatever its damage class (the Tesla Cannon's electric blast
# with its beam). false: as X865 (only explosive-class blasts; a Tesla click took the blast past the cap).
damageCapAnyBlast = true
# The balance's armour: NTM's combat sets take bullets, beams and blasts (NTM's PHYS, EN and EXPL) by one formula instead
# of NTM's threshold and resistance. A hit of damage D, its ammo's threshold negation neg and armour piercing pen, on a
# set of rating S: rho = (D + neg)·(1 + pen) / S; the share that gets through m = b + (1 − d − b)·rho³/(1 + rho³), so
# a weak hit loses most of itself and a strong one gets nearly all through, but no hit is ever 0 (m ≥ b) and none
# all (m ≤ 1 − d); b and d go by the set's tier (b 0.25 → 0.025, d 0.06 → 0.20 from steel to euphemium). What is left
# is F(D)·m, F squeezing one hit's damage past balanceFleshKnee towards balanceFleshMax (never more). Beams and lasers
# (EN) meet balanceEnShare of S; blasts S itself, but one of more than balanceExplRawLimit raw damage (a mine, C4,
# TNT) is not squeezed. A piece alone takes its share of the body (helmet 3, chestplate 8, leggings 6, boots 3 of 20)
# with its own set's numbers, the rest of the body what NTM gives. Fire, radiation, gas, nuclear blasts and falling are
# NTM's. Anyone wearing the sets: players, FBI agents, AI bots. Euphemium's and DNS's invulnerability stay NTM's. The
# joke set (the dineutronium ingot set) keeps NTM's numbers, but a hit keeps at least balanceRoflFloor of itself;
# starmetal is a combat set of tier 6 with bismuth's numbers (balanceS.starmetal 0: NTM's joke set again, as X875). The GL-54's acid corrodes S as it does NTM's numbers. balanceS.<set>: each set's rating (0: NTM's numbers
# for that set). Off: NTM's armour as it is.
balanceArmor = true
# balanceArmorBlasts off: blasts take NTM's threshold and resistance, bullets and beams the formula's (euphemium's pool
# then takes no blasts: they are NTM's, stopped by its invulnerability).
balanceArmorBlasts = true
balanceEnShare = 0.75
balanceFleshKnee = 8
balanceFleshMax = 14
balanceExplRawLimit = 60
# A weapon's blast (a hand grenade, a 40 mm shell, a rocket) hits a combat set as if balanceBlastPower times stronger:
# the formula takes that damage (its power and the flesh's squeeze), but never more than the blast does with no
# armour; whether it is squeezed (balanceExplRawLimit) and capped goes by its own damage. Explosive bullets' blasts
# (their gun's table multiplier) and big charges are not touched. 2.7: as X865, 1: as X858.
balanceBlastPower = 3
# The power by the set's tier, at most balanceBlastPower: sets of tier 4 and below (steel to Security) take
# balanceBlastPowerLow, so a grenade needs 3-4 hits on them, not 2; a rocket's direct hit on tier 7 (RPA, CMB,
# Schrabidium) balanceBlastPowerRocketHigh (a Missile Launcher's round: 6 hits on RPA). DNS, FAU and euphemium take
# balanceBlastPower. All three 2.7: as X865.
balanceBlastPowerLow = 1.7
balanceBlastPowerRocketHigh = 2.2
# balanceBlastPowerRocketHigh is only for a rocket of more raw damage than this (the Missile Launcher's 50, Stinger's
# 35): Panzerschreck's 25 takes balanceBlastPower on tier 7, 12 hits on RPA as the 40 mm MK108's 25, not 18. 0: every
# rocket, as X873.
balanceBlastRocketHighFrom = 30
# A weapon's blast on a set of tier 4 and below hits it with at least this share of the set's rating as its power: a
# gunpowder or DEMO grenade or a 40 mm shell's splash takes 3-4 hits on tier 4 (9-15 without; 3 with no armour), the HE
# grenade's 3 as it was. A blast weaker than 7 raw (its far edge) gets the floor in its share of 7. 0: as X873.
# The floor lifts only the share of the blast that passes, its flesh is the blast's own (balanceBlastFloorShare; false:
# the floor's flesh too, as X875, and a set of a greater rating took more of a weak blast: Congo Lake's splash at 3
# blocks took 5 hits on tier 4, 6 on T-51b). 0.83 with balanceBlastFloorShare false: as X875.
balanceBlastLowFloor = 0.9
balanceBlastFloorShare = true
# The tier Trenchmaster takes a weapon's blast at (the power and the floor above). NTM gives it HEV's explosion
# resistance; at its own tier 6 it took MK108's or a rocket's direct hit in 3 hits against HEV's 4. 6: as X877.
balanceBlastTrenchTier = 4
# An explosive bullet's blast (NTM deals it with the bullet's whole damage) is squeezed and capped at any raw damage, not
# taken for a mine past balanceExplRawLimit. false: as X865 (a heavy gun's HE round past the limit killed any set at once).
balanceBulletBlastCap = true
# An infrared beam (the IR capacitors of the laser guns and Lacunae, NTM's fire class) is a beam: the formula's (EN)
# and the cap's. false: as X865 (NTM's fire numbers, past the formula, the cap and DNS's pool).
balanceIrBeams = true
# An electric hit (the Tesla Cannon's beam and blast) on a powered chestplate counts this many times, with the balance's
# armour on; NTM counts it five times, so one click took a DNS-class set whole. 5: as X865.
balanceElectricPowered = 1.5
balanceRoflFloor = 0.18
balanceS.steel = 8
balanceS.cobalt = 8
balanceS.alloy = 8
balanceS.titanium = 8
balanceS.taurun = 8
balanceS.dieselsuit = 13
balanceS.t51 = 23
balanceS.steamsuit = 66
balanceS.hev = 60
balanceS.ajr = 55
balanceS.ajro = 55
balanceS.security = 56
balanceS.trenchmaster = 72
balanceS.bismuth = 96
balanceS.starmetal = 96
balanceS.bj = 120
balanceS.ncrpa = 120
balanceS.cmb = 159
balanceS.schrabidium = 159
balanceS.rpa = 158
balanceS.fau = 168
balanceS.dns = 186
balanceS.euphemium = 280
# The balance's gun damage: a shot of an NTM gun does NTM's damage times its gun and ammo's mult, and its ammo's armour
# threshold negation and piercing get the pair's additions (the table ntmgunfeel-balance-guns.tsv in the mod jar; a
# file config/ntm-gunfeel-balance-guns.tsv is read instead, checked every two seconds). An ammo with no line of its
# own takes its gun's nearest pair of the same kind (piercing, blast, soft); a gun with no lines is NTM's. A gun's own
# line changes its receiver: Heretic one shot in 12 ticks, not auto, 24 rounds; AM180 one in 3, 60 rounds; AMAT
# Penance one in 15, Subtlety and MAS-36 one in 17; Morning Glory base damage 40. Anyone's shots: players, NTM's mobs,
# AI bots. Off: NTM's damage and receivers.
balanceGuns = true
# A pair's line of the gun table may give the armour formula's least share b times floor= on the sets of tier from= (4
# when not given) and up: armour-piercing rounds, slugs, explosive and flechette shells keep more of themselves against
# armour of tier 4 and up (b was the same share of the flesh's damage for every round, so a soft round, with more of it,
# beat the piercing one), the same gun's soft rounds less from tier 6; the double Lever Action Shotguns less from tier 6,
# the Shredder more, the Pepperbox's stones a fifth from tier 6. The table's floors, on bullets and the pools of DNS, FAU
# and euphemium alike. false: no floors, as X873.
balanceArmorFloor = true
# Rules "pair:set:share" by spaces: a pair of the gun table of tier pair or below (the table's sixth column) hits a set
# of tier set and up with the armour formula's least share times share (on top of the pair's own floor; of several
# rules the least share). 2:4:0.5: a gun and ammo of tier 2 and below get through tier 4 armour (HEV, AJR, Security,
# steam) and up with half the floor, so a man in HEV with a tier 4 gun beats three in steel with tier 2 guns (wins 66 %
# of the pairs and keeps a median 3 HP of 20 without it, 97 % and 10.7 HP with it; the damage cap is per shooter, but
# their guns do not reach it on HEV, so a cap shared by the target would change nothing). 5:8:0.5: a gun of tier 5 and
# below gets through DNS, FAU and euphemium (their pools too) with half the floor: three machine guns of tier 4 took
# DNS in 11 s, now in 21 s and up. Empty or off: no rules, as X884.
balanceArmorTierFloor = 2:4:0.5 5:8:0.5
# The balance's recipes: the diesel suit at the oil tier (helmet: an integrated circuit board instead of the analog one;
# chestplate: two of them and two cast high-speed steel plates, one wool less; leggings: two cast high-speed steel
# plates more), the T-51 chestplate, leggings and boots (an integrated circuit board each, as the helmet), Tesla Cannon
# at tier 7 (a quantum processing unit instead of the military grade board, two welded
# combine steel plates instead of two copper coils), Lasrifle at tier 7 (a quantum processing unit, schraranium
# crystals instead of redstone crystals), Tau at tier 8 (a quantum processing unit, two 4000K coils instead of the
# copper tori, two dineutronium compound plates instead of the copper pipe). One recipe of each in the recipe book and
# JEI. Read when the data packs load: a change counts after /reload or a restart. Off: NTM's recipes.
balanceRecipes = true
# The guns' recipes with the gun mechanisms NTM has no item for (the mod adds them: steel, high-speed steel, desh,
# ferrouranium and technetium steel, cast in the crucible's mechanism mold like NTM's three). A mechanism stands for a
# gun's tier, as in NTM, on eight steps: steel < gunmetal < high-speed steel < desh < ferrouranium < weapon steel <
# technetium steel < saturnite. Steel: the flare gun, Grease Gun, light revolver, Maresleg and Charge Thrower;
# high-speed steel: AM180, Congo Lake, the flamethrower and Liberator; desh: the carbine, heavy revolver,
# Panzerschreck, SPAS-12, UZI, and the B-sides Atlas, Henry Lincoln, the Maresleg pair and Topaz; ferrouranium: AMAT,
# the auto-shotgun, M2, Quadro and the UZI pair; technetium steel: Lag, the minigun, the missile launcher and Tesla
# Cannon (saturnite with balanceRecipes). One recipe of each in the recipe book and JEI. Read when the data packs load:
# a change counts after /reload or a restart. Off: NTM's recipes (the mechanisms stay, cast and melted as before).
gunMechanismRecipes = true
# The balance's armour abilities: a full set's Speed and Jump Boost by its tier (abilities.mobilityCap: up to tier 6
# Speed II and Jump I at most, from tier 7 Speed III and Jump II: the diesel suit III/III -> II/I, Trenchmaster Jump II
# -> I, DNS Jump III -> II), Strength at most abilities.strengthCap on every set (2: NCRPA and RPA IV, CMB V, DNS X,
# Trenchmaster and schrabidium III -> II; 0: NTM's). abilities.bismuth: the bismuth set as a tier 6 set, Speed III,
# Jump II, Regeneration I, night vision, two dashes (off: NTM's VII, VII, II, three dashes, not cut by the keys
# above). The sets' VATS and thermal vision show no players (abilities.esp.players = tier8): only a tier 8 set's
# thermal vision (FAU, DNS) shows the players it sees within abilities.esp.playerRange blocks; off: no players at all;
# all: NTM's, everyone through walls within 64 blocks. AMAT Penance's thermal sight shows players as a tier 8 set.
# The rest (haste, fire resistance, step, hard landing, immunity) is NTM's.
abilities.mobilityCap = true
abilities.strengthCap = 2
abilities.bismuth = true
abilities.esp.players = tier8
abilities.esp.playerRange = 16
# The balance's kit (what a player carries on top of the armour makes a fight about twice as long, not ten times).
# balance.shield: the player's shield. The shield mod (australium III) gives balance.shield.mod (NTM: 25), a shield
# flask balance.shield.flask (NTM: 5; no more flasks once they alone reach the cap), all of it at most
# balance.shield.cap (NTM: 100 of flasks, the mod on top); it comes back balance.shield.delay ticks after the last hit
# (NTM: 60), then balance.shield.rate * t a tick, t the ticks since (NTM: 0.005). NTM keeps its own count of flasks:
# off gives its numbers back. balance.medx: Med-X gives Resistance I for 60 s (NTM: III for 4 min); with
# balanceRecipes its recipe takes two plastic plates and two quartz (NTM: four quartz). balance.superStimpak: the super
# stimpak heals its 25 HP over 12 s (NTM: at once). balance.inserts: an armour insert takes at most
# 1 - balance.inserts.bullets off a bullet (kevlar, SAPI, ESAPI, XSAPI, DU, ghiorsium; their damage and blast shares
# are NTM's). balance.vanilla0: the combat sets of balanceS.* have no vanilla armour points and toughness, so
# vanilla's armour does not come on top of the formula (a set with balanceS 0, the joke sets and the rest keep theirs;
# counts when a piece is put on again). Off: NTM's.
balance.shield = true
balance.shield.mod = 10
balance.shield.flask = 2
balance.shield.cap = 16
balance.shield.delay = 100
balance.shield.rate = 0.002
balance.medx = true
balance.superStimpak = true
# The super stimpak's heal over time does not add up: another one put on the same player (their own or a friend's)
# starts its 25 HP over 12 s again if that is more than is left (else it changes nothing), instead of adding on top (two from two hands
# healed 50 HP in 12 s and took the HEV player's win over three in steel from 97 % to 77 % of the pairs). true: adds
# up, as X884.
balance.healStack = false
balance.inserts = true
balance.inserts.bullets = 0.9
balance.vanilla0 = true
# NTM's FBI agent wears Security: with balance.vanilla0 it gets this much vanilla armour of its own (0: none), as it held
# before the combat sets lost theirs.
balance.fbiArmor = 10
# Euphemium's invulnerability with a pool (balance.immune.mode = pool; ntm: every hit on the full set called off, as
# NTM does). Bullets, beams and blasts are still called off, but each takes from a pool of balance.immune.pool what it
# would do to a DNS-class set (S 186; one hit at most damageCapClick of the health); the pool comes back over
# balance.immune.recover seconds once nothing took from it for balance.immune.refillPause s. Other damage is called off and takes nothing.
# The emptied pool opens a window of balance.immune.window seconds: every hit goes through to the set's rating
# (balanceS.euphemium) and the damage cap, and the set's Regeneration and Resistance 128 are off. Then the pool fills
# back from 0 over balance.immune.recover seconds, the set invulnerable meanwhile. The tomb's radon gas takes the
# invulnerability off entirely (with the Regeneration and Resistance) while the wearer is in it: its radiation counts.
balance.immune.mode = pool
balance.immune.pool = 150
balance.immune.window = 15
balance.immune.recover = 60
# For euphemium, DNS and FAU alike: a shot, IR beam or blast in the window (not melee) keeps it open at least this many seconds after it, so a
# gun that does not kill in the window goes on while it keeps hitting (a reload included), instead of the set's whole
# invulnerability and a new pool (no gun took between 60 and 120 s on DNS; one gun took 45 s on DNS and 134 on FAU).
# 0: the window is its own length, as X873.
balance.immune.hold = 10
# For the three sets: seconds after the last hit that took from the pool before it starts to come back. A gun whose
# reload is longer (Henry and Lincoln: 9.5 s) gets part of the pool back on every reload, and their window closes in
# the reload too (a shot and the reload, 10.5 s, past balance.immune.hold): they took DNS in 400-3500 s. Both keys at 11
# take it in 140-260 s. 5: as X875.
balance.immune.refillPause = 5
# One pool a player for DNS, FAU and euphemium: putting another kit on keeps where the pool is (its share of the full pool, the
# window, the recovery), instead of a fresh pool of the other kit's (DNS emptied, then FAU on, was a full pool of 45
# at once). false: a pool a kit, as X884.
balance.immune.shared = true
# DNS and FAU, the 240-hour sets, take euphemium's round with their own numbers (balance.immune.dns.* and
# balance.immune.fau.*). Mode pool: while the pool holds, bullets, beams and blasts on the full charged set are called
# off, each taking from the pool what it would have done to the set itself (balanceS.dns 186, balanceS.fau 168; one
# hit at most damageCapClick of the health); the emptied pool opens a window of .window seconds where hits go through
# to the set's rating, then the pool fills back over .recover seconds, the set invulnerable meanwhile. A pool not
# emptied comes back at the same rate once nothing took from it for balance.immune.refillPause s. Other damage is NTM's numbers of the set; the
# tomb's radon gas takes the pool off while the wearer is in it. Mode formula: no invulnerability, the set's rating
# only (as before the pool); DNS also ntm: every hit but a blast called off, blasts down to 0.001, as NTM does.
balance.immune.dns.mode = pool
balance.immune.dns.pool = 40
balance.immune.dns.window = 15
balance.immune.dns.recover = 60
balance.immune.fau.mode = pool
balance.immune.fau.pool = 45
balance.immune.fau.window = 15
balance.immune.fau.recover = 60
# NTM's beams (laser guns, Tesla Cannon, Lacunae, Tau, N.I.4.N.I., Aberrator, shredder shells, laser grenade) go
# through blocks as a bullet of the same damage: through fence gaps and empty cells, piercing glass and thin wood with
# the same loss, wearing and breaking what bullets wear and break. They leave no holes; a creature behind a pierced
# block gets what is left, blocks behind the creature a beam hits are not touched (water: beamWater, glass for lasers:
# laserGlass); Folly's beam and Tau's charged shot go through blocks, as in NTM. The same for the Tauon and
# Maxwell turrets and the Tesla arcs (the coil, the crabs, the Tesla armor): they see and hit a target where their
# beam gets through, with what is left of its damage (a turret's shot with the zone it meets on the model). Off: NTM's
# beams, stopped by the first block with a box.
beamRules = true
# With beamRules, beams in water (guns', turrets', Tesla arcs): the damage falls with the path through water,
# x exp(-s/beamWaterLength) (s in blocks; a falling stream counts 0.15 of its path), and where less than beamWaterFade
# of it is left the beam is gone, hitting nothing past there. With 2 and 0.1: 1 block of water leaves 0.61 of the
# damage, 3 blocks 0.22, a beam is gone after 4.6 blocks. A turret or a Tesla coil does not see a target its beam
# would not reach. Off: beams go through water as in NTM.
beamWater = true
beamWaterLength = 2.0
beamWaterFade = 0.1
# Lasers go through glass of any kind (vanilla glass and panes, NTM's glass, wired glass, laminate, machine windows)
# without breaking, wearing or holing it and without losing damage: with beamRules the laser beams (Laser Pistol,
# Pew Pew, Laser Rifle, Morning Glory, Lacunae, the laser grenade, the Shredder's plasma beam, the Maxwell turret),
# and the mobs' flying laser shots (the masked man's bolt, tracer and orb, BOT Prime's and the UFO's bolt and laser).
# The Shredder's slow drops, other beams (Tesla, Tau, Tauon, N.I.4.N.I., Aberrator) and bullets meet glass as bullets
# do. Off: lasers meet glass as bullets do.
laserGlass = true
# Bullets pierce machines (NTM's and other mods' machines: a hollow steel casing). Off: a machine stops every bullet.
bulletPierceMachines = false
# The clear pixels on the models of NTM's machines are glass, not air (a chemical plant's windows): a bullet pierces
# them as glass, loses a little and leaves a hole, whatever bulletPierceMachines says. Grates and other really empty
# places stay open (ntmgunfeel-machine-glass.txt in the mod). Off: bullets fly through the windows as through air.
bulletMachineGlass = true

# No shot right after a sprint (as TaCZ's sprint_time). While a player sprints the sprint time grows to the gun's
# sprintFireTime (seconds) and after the sprint it runs back down at the same rate; the gun does not fire while it is
# above zero. A click held back fires once it runs out, if the key is still held. The client stops sprinting while a
# fire key is held or the gun aims. On by default; a gun can have its own: hbm\:gun_xxx.sprintFireDelay = false
sprintFireDelay = true
sprintFireTime = 0.15
# pistols and revolvers 0.08, submachine guns 0.1, heavy guns and launchers 0.19, the rest 0.15
hbm\:gun_light_revolver.sprintFireTime = 0.08
hbm\:gun_light_revolver_atlas.sprintFireTime = 0.08
