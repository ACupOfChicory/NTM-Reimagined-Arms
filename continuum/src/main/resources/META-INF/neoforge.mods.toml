modLoader = "javafml"
loaderVersion = "[1,)"
license = "GPL-3.0-only"

[[mods]]
modId = "ntmgunfeel"
# filled in by the build from git (CLAUDE.md, "Versioning"): never by hand
version = "${mod_version}"
displayName = "NTM Reimagined Arms ${mod_display_version}"
description = "HBM NTM guns for NTM Continuum: hold-to-aim (server), smooth camera recoil, spring model recoil, centred hip position, hidden off-hand item and corner ammo HUD (client)."

# the mixins into Minecraft
[[mixins]]
config = "ntmgunfeel.mixins.json"

# the mixins into NTM Continuum
[[mixins]]
config = "ntmgunfeel-hbm.mixins.json"

[modproperties.ntmgunfeel]
ntmTested = "${ntm_range}"

[[dependencies.ntmgunfeel]]
modId = "hbm"
type = "required"
versionRange = "${ntm_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.ntmgunfeel]]
modId = "golemcore"
type = "required"
versionRange = "${golemcore_range}"
ordering = "AFTER"
side = "BOTH"
