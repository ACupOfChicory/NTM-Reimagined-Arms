# NTM Reimagined Arms on Minecraft 1.21.1 for NTM: Decentralized Edition (NeoForge 21.1).
# The version is counted from git in build.gradle.kts (see the root CLAUDE.md, port/* branches), not set here.
org.gradle.jvmargs = -Xmx3G
org.gradle.parallel = true
# NeoForge 21.1: the version NTM: Decentralized Edition is built against (its gradle.properties, neo_version)
deps.neoforge = 21.1.249
# NTM: Decentralized Edition, the CurseForge release (file 9434569); libs/ is not in git, see README.md
deps.ntm = libs/ntm-de-1.21.1-1.0.0-beta.14.jar
# the DE version this build is tested with, for neoforge.mods.toml (ntmTested)
deps.ntmTested = [1.0.0-beta.14]
